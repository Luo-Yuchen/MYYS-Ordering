name: 部署点单网页到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取代码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 GitHub Pages
        run: pnpm build:github-pages
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传静态产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github-pages
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
